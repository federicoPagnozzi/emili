# Linux CI gate (improvement plan P2 Task 7).
# All the logic lives in testing/ci_linux.sh so that testing/ci_docker.sh can
# run the identical steps locally; keep this file a thin trigger.
name: ci
on: [push, pull_request]
jobs:
  linux-gate:
    name: linux-gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: scalar + SIMD release and sanitizer builds, parity, goldens, negative tests
        run: bash testing/ci_linux.sh
